<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeggySPA｜AI 招商文案軍師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #fdf2f2; scroll-behavior: smooth; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(230, 0, 18, 0.1); }
        .style-btn.active { background: #e60012; color: white; border-color: #e60012; box-shadow: 0 4px 12px rgba(230, 0, 18, 0.3); transform: translateY(-2px); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-8 pb-32">

<div class="max-w-7xl mx-auto">
    <header class="text-center mb-10">
        <h1 class="text-4xl font-black text-[#e60012] mb-2 tracking-tighter">🔥 PeggySPA 招商文案生成器</h1>
        <p class="text-gray-500 font-medium tracking-widest uppercase text-xs">專屬 AI 招商軍師系統</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="glass-card p-6 rounded-3xl shadow-xl">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-wand-magic-sparkles text-red-500"></i> 1. 文案風格</h3>
                <div class="grid grid-cols-2 gap-3" id="styleGroup">
                    <button class="style-btn border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold active" onclick="selectStyle(this, '溫暖激勵')">溫暖激勵</button>
                    <button class="style-btn border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold" onclick="selectStyle(this, '犀利直球')">犀利直球</button>
                    <button class="style-btn border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold" onclick="selectStyle(this, '數據獲利')">數據獲利</button>
                    <button class="style-btn border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold" onclick="selectStyle(this, '故事感性')">故事感性</button>
                </div>

                <h3 class="text-lg font-bold mt-8 mb-4"><i class="fa-solid fa-pen text-red-500"></i> 2. 今日靈感</h3>
                <textarea id="keywords" rows="5" class="w-full p-4 border-2 border-gray-100 rounded-2xl focus:border-red-500 outline-none text-sm" placeholder="例如：月獲利10萬、宙元石專利..."></textarea>
                
                <button onclick="generatePrompt()" class="w-full mt-6 bg-[#e60012] text-white py-4 rounded-2xl font-black text-lg shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-bolt"></i> 生成 AI 招商指令
                </button>
            </div>
        </div>

        <div class="lg:col-span-8 space-y-6">
            <div id="promptBox" class="glass-card p-6 rounded-3xl shadow-xl border-2 border-dashed border-red-200 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-black text-red-600">✨ AI 指令已備妥：</h3>
                    <button onclick="copyText('finalPrompt')" class="text-xs bg-red-600 text-white px-4 py-1.5 rounded-full font-bold">一鍵複製</button>
                </div>
                <textarea id="finalPrompt" readonly class="w-full h-48 bg-gray-50 p-4 rounded-2xl text-sm text-gray-600 outline-none border-none"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                <div class="glass-card rounded-3xl shadow-lg border-t-4 border-blue-600 p-4">
                    <div class="flex justify-between mb-2"><span class="font-black text-blue-700">FB</span><button onclick="copyText('fbResult')" class="text-[10px] bg-gray-100 px-2 py-1 rounded">複製</button></div>
                    <div id="fbResult" contenteditable="true" class="h-64 overflow-y-auto text-sm text-gray-400 italic text-left">貼上文案...</div>
                </div>
                <div class="glass-card rounded-3xl shadow-lg border-t-4 border-pink-500 p-4">
                    <div class="flex justify-between mb-2"><span class="font-black text-pink-700">IG</span><button onclick="copyText('igResult')" class="text-[10px] bg-gray-100 px-2 py-1 rounded">複製</button></div>
                    <div id="igResult" contenteditable="true" class="h-64 overflow-y-auto text-sm text-gray-400 italic text-left">貼上文案...</div>
                </div>
                <div class="glass-card rounded-3xl shadow-lg border-t-4 border-black p-4">
                    <div class="flex justify-between mb-2"><span class="font-black text-black">Threads</span><button onclick="copyText('threadsResult')" class="text-[10px] bg-gray-100 px-2 py-1 rounded">複製</button></div>
                    <div id="threadsResult" contenteditable="true" class="h-64 overflow-y-auto text-sm text-gray-400 italic text-left">貼上文案...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentStyle = '溫暖激勵';

    function selectStyle(btn, s) {
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStyle = s;
    }

    function generatePrompt() {
        const k = document.getElementById('keywords').value || "招商獲利、專利技術";
        const prompt = `你現在是 PeggySPA 招商顧問。請根據以下資訊生成三篇貼文：
風格：${currentStyle} / 亮點：${k}

1. FB (深度信任感)：300-500字。
2. IG (質感氛圍感)：100字內，附 Reels 建議。
3. Threads (犀利共鳴感)：80字內。
*請用台灣口吻，嚴禁使用大陸用語。`;

        document.getElementById('finalPrompt').value = prompt;
        document.getElementById('promptBox').classList.remove('hidden');
        window.scrollTo({ top: document.getElementById('promptBox').offsetTop - 100, behavior: 'smooth' });
    }

    function copyText(id) {
        const el = document.getElementById(id);
        const text = el.value || el.innerText;
        navigator.clipboard.writeText(text).then(() => alert('已複製成功！'));
    }
</script>
</body>
</html>
