<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeggySPA｜無限招商文案軍師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #fdf2f2; scroll-behavior: smooth; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(230, 0, 18, 0.1); }
        .style-btn { transition: all 0.3s; border: 2px solid #f3f4f6; }
        .style-btn.active { background: #e60012; color: white; border-color: #e60012; box-shadow: 0 4px 12px rgba(230, 0, 18, 0.3); transform: translateY(-2px); }
        .result-box { min-height: 280px; transition: all 0.3s ease; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .generating { animation: pulse 0.4s infinite; }
    </style>
</head>
<body class="p-4 md:p-8 pb-32">

<div class="max-w-7xl mx-auto">
    <header class="text-center mb-10">
        <h1 class="text-4xl font-black text-[#e60012] mb-2 tracking-tighter">🔥 PeggySPA 無限文案生成器</h1>
        <p class="text-gray-400 font-medium text-xs tracking-[0.3em] uppercase">Peggy's Infinite AI Copy Engine</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="glass-card p-8 rounded-[2.5rem] shadow-xl border-2 border-white">
                <h3 class="text-xl font-black mb-6 flex items-center gap-2 text-gray-700">
                    <i class="fa-solid fa-dice text-red-500"></i> 點擊風格・無限生成
                </h3>
                <div class="grid grid-cols-2 gap-4" id="styleGroup">
                    <button class="style-btn p-5 rounded-2xl text-sm font-black active" onclick="generate('激勵')">溫暖激勵</button>
                    <button class="style-btn p-5 rounded-2xl text-sm font-black" onclick="generate('犀利')">犀利直球</button>
                    <button class="style-btn p-5 rounded-2xl text-sm font-black" onclick="generate('數據')">數據獲利</button>
                    <button class="style-btn p-5 rounded-2xl text-sm font-black" onclick="generate('故事')">感性故事</button>
                </div>

                <div class="mt-10 p-6 bg-white/50 rounded-2xl border border-red-50 italic text-red-400 text-xs leading-loose">
                    * 提示：同一個按鈕可以「連續點擊」，每次都會組裝出不同的內容組合，讓妳發文不撞詞！
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-card rounded-[2.5rem] shadow-xl overflow-hidden flex flex-col border-t-8 border-blue-600">
                <div class="p-5 bg-blue-50 flex justify-between items-center"><span class="font-black text-blue-700 text-sm">FB 深度版</span><button onclick="copyText('fb')" class="bg-white px-3 py-1 rounded-full text-[10px] font-bold shadow-sm">複製</button></div>
                <div id="fb" contenteditable="true" class="result-box p-6 text-sm leading-relaxed text-gray-600 overflow-y-auto scrollbar-hide">點擊按鈕生成...</div>
            </div>
            <div class="glass-card rounded-[2.5rem] shadow-xl overflow-hidden flex flex-col border-t-8 border-pink-500">
                <div class="p-5 bg-pink-50 flex justify-between items-center"><span class="font-black text-pink-700 text-sm">IG 質感版</span><button onclick="copyText('ig')" class="bg-white px-3 py-1 rounded-full text-[10px] font-bold shadow-sm">複製</button></div>
                <div id="ig" contenteditable="true" class="result-box p-6 text-sm leading-relaxed text-gray-600 overflow-y-auto scrollbar-hide">點擊按鈕生成...</div>
            </div>
            <div class="glass-card rounded-[2.5rem] shadow-xl overflow-hidden flex flex-col border-t-8 border-black">
                <div class="p-5 bg-gray-50 flex justify-between items-center"><span class="font-black text-black text-sm">Threads</span><button onclick="copyText('threads')" class="bg-white px-3 py-1 rounded-full text-[10px] font-bold shadow-sm">複製</button></div>
                <div id="threads" contenteditable="true" class="result-box p-6 text-sm leading-relaxed text-gray-600 overflow-y-auto scrollbar-hide">點擊按鈕生成...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const pool = {
        '激勵': {
            start: ["【夢想不是用來想的】✨", "【妳的努力，值得被看見】🌹", "【給自己一個翻轉的機會】🚀", "【致每一位勇敢的創業女性】💎"],
            mid: ["PeggySPA 遠紅外線熱導儀，是妳轉型路上的最強後盾。", "這不只是一台儀器，更是一套讓妳優雅獲利的系統。", "我們陪妳從零開始，建立專屬自己的美容事業。", "告別勞力賺錢，用科技與專業找回生活品質。"],
            end: ["今日僅限2名諮詢，私訊我聊聊吧！", "現在就點擊私訊，開啟妳的蛻變之旅。", "我在成功路上的終點，等妳一起加入。", "留言「+1」領取專屬創業企劃書。"]
        },
        '犀利': {
            start: ["【還在靠體力賺錢嗎？】🔥", "【實話往往最難聽】🚀", "【妳的生意為什麼留不住人？】💡", "【別讓觀望毀了妳的商機】⚠️"],
            mid: ["傳統按摩太累、收入卻有天花板，這就是現實。", "PeggySPA 宙元石專利技術，讓客人一次就黏住。", "市場不會等妳準備好，只會等著把妳淘汰。", "聰明人都在用系統滾雪錢，妳還在用雙手拼命？"],
            end: ["想轉型的美容師，私訊我，不廢話。", "猶豫只會讓妳錯過最好的時機。", "這是一個看數據說話的時代，來聊聊吧。", "機會只留給敢踏出舒適圈的人。"]
        },
        '數據': {
            start: ["【月收翻倍的精算邏輯】💰", "【低成本、高淨利的商業模版】📊", "【數據揭秘：熱導儀獲利真相】🔍", "【美容店營收暴增的祕密】📈"],
            mid: ["月獲利 8-15 萬不是夢，關鍵在於專利儀器的回購率。", "耗材成本極低，單次療程淨利高達 70% 以上。", "客源轉介率提升 40%，這就是科技美容的威力。", "完整保姆級教學，縮短妳 90% 的摸索時間。"],
            end: ["立刻私訊獲取「月入十萬」獲利分析表。", "名額倒數，現在加入最划算。", "報名諮詢，我算給妳看利潤有多大。", "私訊「轉型」，預約一對一事業分析。"]
        },
        '故事': {
            start: ["【那晚，她對我說了心聲...】🕯️", "【從全職媽媽到事業女性】🌸", "【這台儀器傳遞的是溫暖】🤝", "【看見她們眼中的光，我懂了】✨"],
            mid: ["她曾害怕自己跟社會脫節，但在 PeggySPA 找回了自信。", "熱導儀不只暖了客人的身，也暖了創業者疲憊的心。", "我們是一群熱愛分享美的家人，不只是生意夥伴。", "每一位加入的夥伴，都是 Peggy 最珍視的傳承者。"],
            end: ["加入我們，不只創業，更是遇見更好的自己。", "期待在 PeggySPA 的大家庭見到妳。", "私訊我，聽聽更多夥伴翻轉人生的故事。", "美學創業，從這份溫暖的連結開始。"]
        }
    };

    function generate(type) {
        // 切換按鈕狀態
        document.querySelectorAll('.style-btn').forEach(b => {
            b.classList.remove('active');
            if(b.innerText.includes(type)) b.classList.add('active');
        });

        const fb = document.getElementById('fb');
        const ig = document.getElementById('ig');
        const th = document.getElementById('threads');

        // 視覺特效
        [fb, ig, th].forEach(el => el.classList.add('generating'));

        setTimeout(() => {
            const getRand = (arr) => arr[Math.floor(Math.random() * arr.length)];
            const s = pool[type];

            // FB: 深度組裝
            fb.innerText = `${getRand(s.start)}\n\n${getRand(s.mid)}\n\n${getRand(s.mid)}\n\n${getRand(s.end)}`;
            
            // IG: 隨機標籤組裝
            ig.innerText = `${getRand(s.start)}\n${getRand(s.mid)}\n\n#PeggySPA #美容創業 #熱導儀 #宙元石 #女性創業`;
            
            // Threads: 隨機短句組裝
            th.innerText = `${getRand(s.start)} ${getRand(s.mid)} 想了解的朋友留言「+1」。`;

            [fb, ig, th].forEach(el => {
                el.classList.remove('generating');
                el.classList.remove('text-gray-400', 'italic');
            });
        }, 400);
    }

    function copyText(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = event.target;
            const original = btn.innerText;
            btn.innerText = 'OK!';
            setTimeout(() => btn.innerText = original, 1500);
        });
    }
</script>
</body>
</html>
