<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Life｜五大核心科技生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #f4f7f6; scroll-behavior: smooth; }
        .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); border: 1px solid rgba(255, 126, 33, 0.1); }
        .style-btn { transition: all 0.3s; border: 2px solid #e2e8f0; background: white; }
        .style-btn.active { background: #ff7e21; color: white; border-color: #ff7e21; box-shadow: 0 4px 20px rgba(255, 126, 33, 0.4); transform: translateY(-2px); }
        .result-box { min-height: 320px; transition: all 0.4s ease; }
        .tag-pill { background: #fff7ed; color: #ea580c; border: 1px solid #ffedd5; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: bold; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .generating { animation: pulse 0.3s infinite; }
    </style>
</head>
<body class="p-4 md:p-10 pb-32">

<div class="max-w-7xl mx-auto">
    <header class="text-center mb-12">
        <div class="flex justify-center gap-2 mb-4">
            <span class="tag-pill">遠紅外線</span><span class="tag-pill">負離子</span><span class="tag-pill">AI 科技</span><span class="tag-pill">健康生活</span><span class="tag-pill">熱導設備</span>
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-[#1a202c] mb-2 tracking-tighter">
            <span class="text-orange-500">U-Life</span> 健康生活推廣總監
        </h1>
        <p class="text-gray-400 font-bold text-xs tracking-[0.4em] uppercase">智慧科技與大健康產業的完美結合</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl border-2 border-white">
                <h3 class="text-xl font-black mb-6 flex items-center gap-2 text-gray-700">
                    <i class="fa-solid fa-brain text-orange-500"></i> AI 風格決策
                </h3>
                <div class="grid grid-cols-1 gap-4">
                    <button class="style-btn p-5 rounded-2xl text-base font-black active" onclick="generate('未來趨勢')">AI 智慧與未來趨勢</button>
                    <button class="style-btn p-5 rounded-2xl text-base font-black" onclick="generate('科技修復')">遠紅外線與科技修復</button>
                    <button class="style-btn p-5 rounded-2xl text-base font-black" onclick="generate('商機獲利')">負離子商機獲利</button>
                    <button class="style-btn p-5 rounded-2xl text-base font-black" onclick="generate('生活藍圖')">U-Life 健康生活藍圖</button>
                </div>

                <div class="mt-10 p-6 bg-slate-900 rounded-3xl text-white shadow-inner">
                    <p class="text-orange-400 text-xs font-black mb-4 italic">AI QUICK ACCESS</p>
                    <div class="grid grid-cols-2 gap-3">
                        <a href="https://gemini.google.com/" target="_blank" class="flex items-center justify-center gap-2 bg-[#4285F4] py-3 rounded-xl text-xs font-bold hover:brightness-110 transition">
                            <i class="fa-solid fa-g"></i> Gemini
                        </a>
                        <a href="https://chatgpt.com/" target="_blank" class="flex items-center justify-center gap-2 bg-[#10a37f] py-3 rounded-xl text-xs font-bold hover:brightness-110 transition">
                            <i class="fa-solid fa-bolt"></i> GPT
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 space-y-6">
            <div id="aiPromptBox" class="glass-card p-6 rounded-[2rem] shadow-xl border-2 border-dashed border-orange-200 hidden mb-6">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-orange-600 font-black text-sm">✨ 複製後貼給上方 AI 按鈕：</span>
                    <button onclick="copyText('finalPrompt')" class="bg-orange-500 text-white px-4 py-1 rounded-full text-xs font-bold">一鍵複製指令</button>
                </div>
                <textarea id="finalPrompt" readonly class="w-full h-24 bg-gray-50 p-4 rounded-xl text-xs text-gray-500 outline-none border-none resize-none"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-card rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border-t-8 border-blue-600">
                    <div class="p-5 bg-blue-50 flex justify-between items-center"><span class="font-black text-blue-800 text-sm">FB 權威觀點</span><button onclick="copyText('fb')" class="bg-white text-blue-700 px-3 py-1 rounded-full text-[10px] font-black shadow-sm">COPY</button></div>
                    <div id="fb" contenteditable="true" class="result-box p-6 text-sm leading-relaxed text-gray-600 overflow-y-auto scrollbar-hide font-medium italic">點擊左側開始 AI 生成...</div>
                </div>
                <div class="glass-card rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border-t-8 border-orange-500">
                    <div class="p-5 bg-orange-50 flex justify-between items-center"><span class="font-black text-orange-700 text-sm">IG 視覺行銷</span><button onclick="copyText('ig')" class="bg-white text-orange-700 px-3 py-1 rounded-full text-[10px] font-black shadow-sm">COPY</button></div>
                    <div id="ig" contenteditable="true" class="result-box p-6 text-sm leading-relaxed text-gray-600 overflow-y-auto scrollbar-hide font-medium italic">等待生成...</div>
                </div>
                <div class="glass-card rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border-t-8 border-slate-800">
                    <div class="p-5 bg-gray-100 flex justify-between items-center"><span class="font-black text-black text-sm">Threads 趨勢說</span><button onclick="copyText('threads')" class="bg-white text-black px-3 py-1 rounded-full text-[10px] font-black shadow-sm">COPY</button></div>
                    <div id="threads" contenteditable="true" class="result-box p-6 text-sm leading-relaxed text-gray-600 overflow-y-auto scrollbar-hide font-medium italic">等待生成...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const dataPool = {
        '未來趨勢': {
            start: ["【當 AI 遇上大健康，妳看見商機了嗎？】🤖", "【總監直擊：2026 科技健康生活新標準】🚀", "【未來的獲利模式：AI 智慧與精準健康】💎"],
            mid: ["U-Life 領先業界將 AI 邏輯導入健康管理，配合高效能熱導設備，實現精準調理。", "我們不僅提供負離子與遠紅外線雙重技術，更用智慧系統協助夥伴分析商機。", "這不只是一場技術革命，更是對傳統健康生活方式的全面升級。"],
            end: ["立刻私訊，獲取 U-Life AI 健康創業報告。", "留言「AI」領取總監親筆撰寫的轉型計畫。", "加入我們，站在智慧健康產業的最前線。"]
        },
        '科技修復': {
            start: ["【負離子＋遠紅外線：雙效修復的奇蹟】✨", "【熱導設備：讓每一顆細胞重新呼吸】🔥", "【為什麼 U-Life 的熱導技術是市場唯一？】🔍"],
            mid: ["利用遠紅外線深層共振，配合負離子中和環境壓力，達到極致的健康平衡。", "專業熱導設備不只是工具，它是將大自然能量導入家中的智慧媒介。", "U-Life 專利宙元石技術，將負離子含量提升至森林等級，讓修復無處不在。"],
            end: ["想體驗科技修復的力量？私訊領取體驗名應。", "私訊「健康」，了解 U-Life 核心設備代理權。", "讓科技成為妳照顧全家健康的最好後盾。"]
        },
        '商機獲利': {
            start: ["【健康財富：負離子產業的百億藍海】💰", "【熱導設備代理：美容與健康店家的救星】📈", "【為什麼總監選在今年全面推廣 U-Life？】📊"],
            mid: ["當負離子科技遇上高效熱導設備，創造的是客人的回購率與店家的淨利潤。", "結合遠紅外線熱效應，讓妳的服務項目具備 AI 級別的競爭力與獨特性。", "低門檻切入大健康市場，用 U-Life 的系統實現財務與時間的自由。"],
            end: ["名額倒數，現在加入享總監親自帶隊資源。", "私訊「獲利」，我教妳如何用健康系統滾雪球。", "立刻諮詢，預約妳的 U-Life 事業版圖。"]
        },
        '生活藍圖': {
            start: ["【U-Life：定義妳的理想健康生活】🌸", "【從負離子空氣到遠紅外線熱感修復】✨", "【這是一份關於愛、科技與傳承的事業】🤝"],
            mid: ["我們致力於將 AI 智慧融入日常，讓每一天的生活都充滿負離子的純淨與溫暖。", "U-Life 不只是招商，更是邀請妳成為健康生活的推廣總監，改變更多家庭。", "透過熱導設備，將這份遠紅外線的溫熱傳遞給每一個需要的靈魂。"],
            end: ["期待在 U-Life 的成功聚會中見到妳。", "私訊了解 U-Life 全方位健康生活解決方案。", "留言「+1」，我傳一份改變人生的藍圖給妳。"]
        }
    };

    function generate(type) {
        document.querySelectorAll('.style-btn').forEach(b => {
            b.classList.remove('active');
            if(b.innerText.includes(type)) b.classList.add('active');
        });

        const fb = document.getElementById('fb');
        const ig = document.getElementById('ig');
        const th = document.getElementById('threads');
        const promptBox = document.getElementById('aiPromptBox');
        const promptText = document.getElementById('finalPrompt');

        [fb, ig, th].forEach(el => el.classList.add('generating'));

        setTimeout(() => {
            const getRand = (arr) => arr[Math.floor(Math.random() * arr.length)];
            const s = dataPool[type];

            // 生成預覽內容
            fb.innerText = `${getRand(s.start)}\n\n${getRand(s.mid)}\n\n${getRand(s.mid)}\n\n${getRand(s.end)}`;
            ig.innerText = `${getRand(s.start)}\n${getRand(s.mid)}\n\n#ULife #遠紅外線 #負離子 #AI科技 #健康生活 #熱導設備 #創業總監`;
            th.innerText = `${getRand(s.start)} ${getRand(s.mid)} 認同的請分享。`;

            // 生成隱藏指令給 AI 模型用
            promptBox.classList.remove('hidden');
            promptText.value = `你現在是 U-Life 招商總監。請針對「遠紅外線、負離子、AI 健康、熱導設備」這五個元素，產出更具擴散力的 ${type} 風格貼文。請維持專業、溫暖、且具備健康科技感的台灣口吻。`;

            [fb, ig, th].forEach(el => {
                el.classList.remove('generating');
                el.style.color = '#334155';
                el.style.fontStyle = 'normal';
            });
        }, 500);
    }

    function copyText(id) {
        const text = document.getElementById(id).value || document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('已複製成功！您可以點擊 Gemini 或 GPT 按鈕貼上使用了。');
        });
    }
</script>
</body>
</html>
